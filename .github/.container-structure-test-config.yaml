schemaVersion: 2.0.0

commandTests:
- name: git
  command: git
  args:
  - --version
  expectedOutput:
  - ^git version 2\.[0-9]+\.[0-9]+\n$

- name: pre-commit
  command: pre-commit
  args:
  - -V
  expectedOutput:
  - ^pre-commit ([0-9]+\.){2}[0-9]+\n$

- name: gcc
  command: gcc
  args:
  - --version
  expectedOutput:
  - ^gcc \(Alpine 14\.

- name: checkov
  command: checkov
  args:
  - --version
  expectedOutput:
  - ^([0-9]+\.){2}[0-9]+\n$

# This configuration targets the INSTALL_ALL image, as do the other tool tests.
- name: iac-guard-v
  command: /opt/iac-guard-v/bin/python
  args:
  - -IBm
  - iac_guard_v.cli
  - --version
  expectedOutput:
  - .*1\.[0-9]+\.[0-9]+.*

- name: iac-guard-v controlled scanner
  command: /opt/iac-guard-v/scanner/checkov
  args:
  - --version
  expectedOutput:
  - ^([0-9]+\.){2}[0-9]+\n$

- name: infracost
  command: infracost
  args:
  - --version
  expectedOutput:
  - ^Infracost v([0-9]+\.){2}[0-9]+

- name: opentofu
  command: tofu
  args:
  - --version
  expectedOutput:
  - ^OpenTofu v([0-9]+\.){2}[0-9]+\n

- name: terraform
  command: terraform
  args:
  - --version
  expectedOutput:
  - ^Terraform v([0-9]+\.){2}[0-9]+\n

- name: terraform-docs
  command: terraform-docs
  args:
  - --version
  expectedOutput:
  - ^terraform-docs version v([0-9]+\.){2}[0-9]+ [a-z0-9]+

- name: terragrunt
  command: terragrunt
  args:
  - --version
  expectedOutput:
  - ^terragrunt version v([0-9]+\.){2}[0-9]+\n$

- name: terrascan
  command: terrascan
  args:
  - version
  expectedOutput:
  - >-
    ^version: v([0-9]+\.){2}[0-9]+\n$

- name: tflint
  command: tflint
  args:
  - --version
  expectedOutput:
  - TFLint version ([0-9]+\.){2}[0-9]+\n

- name: tfsec
  command: tfsec
  args:
  - --version
  expectedOutput:
  - ([0-9]+\.){2}[0-9]+\n$

- name: trivy
  command: trivy
  args:
  - --version
  expectedOutput:
  - >-
    Version: ([0-9]+\.){2}[0-9]+\n

- name: tfupdate
  command: tfupdate
  args:
  - --version
  expectedOutput:
  - ([0-9]+\.){2}[0-9]+\n$

- name: hcledit
  command: hcledit
  args:
  - version
  expectedOutput:
  - ([0-9]+\.){2}[0-9]+\n$

- name: entrypoint.sh
  envVars:
  - key: USERID
    value: 1000:1000
  command: /entrypoint.sh
  args:
  - -V
  expectedError:
  - >-
    ^ERROR:  uid:gid 1000:1000 lacks permissions to //\n$
  exitCode: 1

- name: su-exec
  command: su-exec
  expectedOutput:
  - >-
    ^Usage: su-exec user-spec command \[args\]\n$

- name: ssh
  command: ssh
  args:
  - -V
  expectedError:
  - ^OpenSSH_10\.[0-9]+

fileExistenceTests:
- name: terrascan init
  path: >-
    /root/.terrascan/pkg/policies/opa/rego/github/github_repository/privateRepoEnabled.rego
  shouldExist: true
  uid: 0
  gid: 0
